data:
  data_root: "/path/to/dataset"
  problem: "TE_heat"              # TE_heat | NS_heat | E_flow | MHD | VA | Elder | diffusion_reaction
  split: "training"
  val_split: "testing"
  n_tasks: null                   # null = native task count; set to sweep task-count (e.g. N-sweeps)
  task_subset: null               # comma-separated explicit task-name override
  image_size: 128
  max_samples: null
  num_workers: 2

model:
  latent_dim: 64
  backbone_channels: 128
  base_channels: 32
  n_downsample: 3
  score_blocks: 3
  score_heads: 4

diffusion:
  method: "csho"                  # csho | csho_independent | csho_shared_g | csho_independent_g | csho_pairwise | ddpm | sdm
  n_diff_steps: 20
  damping_regime: "critically_damped"  # underdamped | critically_damped | overdamped
  target_zeta: null
  alpha: "1.0"
  beta: "0.5"
  k_reference: 1.0
  constant_k: true
  lambda_ndsm: 1.0

training:
  batch_size: 8
  n_epochs: 5
  lr: 1.0e-3
  seeds: "0,1,2,3,4"

diagnostics:
  explode_threshold: 1000.0
  max_hook_modules: 200

hardware:
  device: "cuda"

logging:
  out_dir: "results/experiment_2_physics"

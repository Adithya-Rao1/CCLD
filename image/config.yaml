data:
  data_root: "/path/to/dataset"  
  source: "nyudv2"                # nyudv2 | pascal | cityscapes
  tasks: "depth,normals"          # comma-separated subset of segmentation,depth,normals,edges,saliency
  image_size: 128
  num_workers: 2

model:
  latent_dim: 64
  backbone_channels: 512
  pretrained_backbone: true
  score_blocks: 4
  score_heads: 4
  score_spatial_stride: 2

diffusion:
  method: "csho"                  # csho | csho_independent | csho_shared_g | csho_independent_g | csho_pairwise | ddpm | sdm
  n_diff_steps: 2
  dt: 0.5
  sigma: 0.1
  damping_regime: "critically_damped"  # underdamped | critically_damped | overdamped
  target_zeta: null
  alpha: "1.0"
  beta: "0.5"
  k_reference: 1.0
  constant_k: false
  task_similarity_json: null
  lambda_ndsm: 1.0

training:
  batch_size: 8
  n_epochs: 5
  lr: 1.0e-3
  seeds: "0,1,2,3,4"

diagnostics:
  explode_threshold: 1000.0
  max_hook_modules: 200

hardware:
  device: "cuda"

logging:
  out_dir: "results/experiment_1_vision"